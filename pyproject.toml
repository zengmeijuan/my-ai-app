[project]
name = "my-ai-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zengmj5", email = "zengmj5@annto.com.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.0",
    "hello-agents>=0.2.9,<0.3",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "openai>=1.100,<2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
my-ai-app = "my_ai_app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
