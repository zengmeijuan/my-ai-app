[project]
name = "my-ai-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zengmj5", email = "zengmj5@annto.com.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "fastembed>=0.8.0",
    "hello-agents>=0.2.9,<0.3",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "langchain-openai>=1.1.9",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=2.3.0",
    "openai>=1.100,<2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
my-ai-app = "my_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 包目录已从 my_ai_app 改名为 my_agent（与项目名 my-ai-app 的规范化结果不再一致，需显式指定）
module-name = "my_agent"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
